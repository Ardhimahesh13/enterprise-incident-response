name: Deploy AegisOps to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy project files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/aegisops"
          overwrite: true

      - name: SSH into EC2, Build, and Run Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout : 20m
          script: |
            cd /home/ubuntu/aegisops
            
            # 1. Generate .env securely from GitHub Secrets
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
            echo "PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}" >> .env
            echo "PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }}" >> .env
            echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" >> .env
            echo "EMBEDDING_MODEL=all-MiniLM-L6-v2" >> .env

            # 2. Stop and remove any previous container
            sudo docker stop aegisops-container || true
            sudo docker rm aegisops-container || true

            # 3. Build the Docker image and clean old dangling images
            sudo docker build -t aegisops-image .
            sudo docker image prune -f

            # 4. Run container on Port 80 with auto-restart
            sudo docker run -d --restart unless-stopped --name aegisops-container -p 80:8000 --env-file .env aegisops-image